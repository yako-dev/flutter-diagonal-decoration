version: 2.0.1
repository: https://github.com/yako-dev/flutter-diagonal-decoration
issue_tracker: https://github.com/yako-dev/flutter-diagonal-decoration/issues

topics:
  - ui
  - decoration
  - background
  - pattern

screenshots:
  - description: "DiagonalDecoration preview"
